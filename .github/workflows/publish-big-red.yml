name: Publish GTA 20 and Big Red (free GitHub Pages)
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'bun.lock'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/publish-big-red.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gta20-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout GTA 20
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check TypeScript
        run: bun run lint
      - name: Build full game for GitHub Pages
        env:
          GITHUB_PAGES: 'true'
        run: bun run build
      - name: Verify complete publish bundle
        run: |
          test -s dist/index.html
          test -s dist/big-red/index.html
          test -d dist/assets
          grep -q '/Gta-20/assets/' dist/index.html
          echo 'Validated main game, Big Red standalone, and Pages asset base'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload full GTA 20 and Big Red game
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
      - name: Deploy public game
        id: deployment
        uses: actions/deploy-pages@v4
